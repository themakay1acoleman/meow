    <title>💖 Love Page 💖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        
        body {
            background: #fff;
            font-family: 'VT323', monospace;
            color: #000;
            min-height: 100vh;
            overflow-x: hidden;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 19px, #000 19px, #000 20px),
                repeating-linear-gradient(90deg, transparent, transparent 19px, #000 19px, #000 20px);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: #fff;
            border: 8px solid #000;
            width: 70%;
            margin: 40px auto;
            box-shadow: 10px 10px 0 #999;
        }

        h1 {
            font-size: 2.5rem;
            font-family: 'VT323', monospace;
            letter-spacing: 2px;
            margin-bottom: 20px;
            color: #000;
            text-shadow: 3px 3px 0 #f00;
        }

        p {
            font-size: 1rem;
            text-align: center;
            margin: 40px 20px;
            animation: pulse 2s ease-in-out infinite;
        }

        a {
            display: block;
            text-align: center;
            margin: 40px;
            padding: 15px 30px;
            background: #000;
            color: #fff;
            text-decoration: none;
            border: 4px solid #000;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        a:hover {
            background: #f00;
            transform: scale(1.1);
        }
    </style>
</head>
