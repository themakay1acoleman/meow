<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dear allen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        
        body {
            background: #fff;
            font-family: 'VT323', monospace;
            overflow-x: hidden;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 19px, #999 19px, #999 20px),
                repeating-linear-gradient(90deg, transparent, transparent 19px, #999 19px, #999 20px);
            background-size: 20px 20px;
            position: relative;
        }

        @keyframes blink {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .sleepy-hover {
            cursor: pointer;
            transition: transform 0.6s ease;
        }

        .sleepy-spin {
            animation: spin 3s linear 1;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: #fff;
            border: 8px solid #000;
            width: 70%;
            margin: 40px auto;
            box-shadow: 10px 10px 0 #f00;
        }

        h1 {
            font-size: 4rem;
            font-family: 'VT323', monospace;
            letter-spacing: 2px;
            margin-bottom: 20px;
            color: #000;
            text-shadow: 3px 3px 0 rgb(132, 132, 132);
        }

        .tagline {
            font-size: 0.9rem;
            animation: pulse 2s ease-in-out infinite;
            color: #000;
        }

        .star {
            display: inline-block;
            margin: 0 10px;
        }

        .heart-image {
            text-align: center;
            margin: 600px 0;
        }

        .heart-image img {
            max-width: 400px;
            width: 100%;
            height: auto;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .heart-image img.heart-hover:hover {
            transform: scale(1.3);
        }

        .header-cupid {
            width: 80px;
            height: auto;
            vertical-align: middle;
            margin: 0 20px;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
        }

        .side-box {
            background: #fff;
            border: 8px solid #000;
            width: 400px;
            padding: 0;
            margin: 130px 20px 0 20px;
            box-shadow: 10px 10px 0 #999;
            min-height: 250px;
        }

        .side-box.right-box {
            position: absolute;
            top: 500px;
            left: 300px;
            margin: 0;
            z-index: 10;
        }

        .side-box-nav {
            background: #000;
            border-top: 5px solid #000;
            border-bottom: 3px solid #000;
            padding: 1px 0 2px 0;
            display: flex;
            flex-direction: column;
            gap: 3px;
            align-items: center;
        }

        .side-box-nav-title {
            background: #666;
            border: 1px solid #000;
            border-radius: 20px;
            color: #fff;
            padding: 2px 45px;
            font-family: 'VT323', monospace;
            font-weight: bold;
            font-size: 0.75rem;
            text-align: center;
            width: auto;
            margin-top: -6px;
        }

        .side-box-nav-buttons {
            display: flex;
            gap: 0px;
            justify-content: flex-start;
            width: 100%;
        }

        .side-box-nav button {
            background: #666;
            border: 1px solid #000;
            border-radius: 0;
            color: #fff;
            padding: 4px 16px;
            font-family: 'VT323', monospace;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.6rem;
            transition: all 0.3s ease;
            flex: 1;
        }

        .side-box-nav button:hover {
            background: #f00;
            color: #fff;
            transform: translateY(-2px);
        }

        .side-box-content {
            padding: 30px 20px 20px 20px;
            line-height: 2;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <img src="cupid1.png" alt="cupid" class="header-cupid">
            <div>
                <h1>
                    <span class="star">♥</span>
                    M E O W
                    <span class="star">♥</span>
                </h1>
                <p class="tagline">~ for allen ~</p>
            </div>
            <img src="cupid1.png" alt="cupid" class="header-cupid">
        </div>
    </header>

    <div class="side-box">
        <div class="side-box-nav">
            <div class="side-box-nav-title">dear allen...</div>
            <div class="side-box-nav-buttons">
                <button>I</button>
                <button>LOVE</button>
                <button>YOU</button>
            </div>
        </div>
        <div class="side-box-content">
            <p>happy valentine's day boob :3</p>
            <p>its been about half a year since we started dating <3...</p>
        </div>
    </div>

    <div class="side-box right-box">
        <div class="side-box-nav">
            <div class="side-box-nav-title">dear allen...</div>
            <div class="side-box-nav-buttons">
                <button>SO</button>
                <button>SO</button>
                <button>MUCH</button>
            </div>
        </div>
        <div class="side-box-content">
            <p>i am so lucky to have met you and to have gotten the chance to get to know you</p>
        </div>
    </div>

    <img src="sleepy.png" alt="Sleepy" class="sleepy-hover" style="position: absolute; width: 130px; top: 360px; right: 750px; z-index: 5;" onclick="this.classList.remove('sleepy-spin'); void this.offsetWidth; this.classList.add('sleepy-spin');" />

    <div class="heart-image" style="position: absolute; top: 400px; right: 10px; margin: 0; text-align: right; display: flex; align-items: flex-end; gap: 32px;">
        <a href="love.html">
            <img src="heart.png" alt="heart" class="heart-hover" style="max-width: 320px; width: 100%; height: auto; margin-right: 0;">
        </a>
        <div style="position: relative; display: inline-block; height: 200px; width: 260px; transform: translate(-160px, -170px);">
            <img src="speechbubble.png" alt="speech bubble" style="height: 200px; width: 100%; display: block;">
            <span style="position: absolute; top: 50%; left: 50%; transform: translate(-45%, -265%); color: #222; font-size: 0.9rem; font-family: 'VT323', monospace; text-align: center; width: 90%; pointer-events: none; text-shadow: 1px 1px 4px #fff, 0 0 2px #fff;">click me if you dare</span>
        </div>
    </div>

    <div style="text-align: right; margin-top: 40px; margin-bottom: 40px; margin-right: 20px;">
        <img src="cinamaroll.gif" alt="Cinnamoroll" style="width: 200px; height: auto;">
    </div>
</body>
</html>
