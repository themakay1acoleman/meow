<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Welcome to the Retro Web ✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        
        body {
            background: #fff;
            font-family: 'VT323', monospace;
            overflow-x: hidden;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 19px, #000 19px, #000 20px),
                repeating-linear-gradient(90deg, transparent, transparent 19px, #000 19px, #000 20px);
            background-size: 20px 20px;
        }

        @keyframes blink {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: #fff;
            border: 8px solid #000;
            width: 70%;
            margin: 40px auto;
            box-shadow: 10px 10px 0 #f00;
        }

        h1 {
            font-size: 2.5rem;
            font-family: 'VT323', monospace;
            letter-spacing: 2px;
            margin-bottom: 20px;
            color: #000;
            text-shadow: 3px 3px 0 rgb(132, 132, 132);
        }

        .tagline {
            font-size: 0.9rem;
            animation: pulse 2s ease-in-out infinite;
            color: #000;
        }

        .star {
            display: inline-block;
            margin: 0 10px;
        }

        .heart-image {
            text-align: center;
            margin: 600px 0;
        }

        .heart-image img {
            max-width: 400px;
            width: 100%;
            height: auto;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .heart-image img:hover {
            transform: scale(1.3);
        }

        .header-cupid {
            width: 80px;
            height: auto;
            vertical-align: middle;
            margin: 0 20px;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
        }

        .side-box {
            background: #fff;
            border: 8px solid #000;
            width: 400px;
            padding: 0;
            margin: 100px 20px 0 20px;
            box-shadow: 10px 10px 0 #999;
            min-height: 250px;
        }

        .side-box.right-box {
            position: absolute;
            top: 500px;
            left: 300px;
            margin: 0;
            z-index: 10;
        }

        .side-box-nav {
            background: #000;
            border-bottom: 2px solid #000;
            padding: 3px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .side-box-nav button {
            background: #f00;
            border: 3px solid #000;
            color: #fff;
            padding: 8px 15px;
            font-family: 'VT323', monospace;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.7rem;
            transition: all 0.3s ease;
        }

        .side-box-nav button:hover {
            background: #fff;
            color: #f00;
            transform: scale(1.1);
        }

        .side-box-content {
            padding: 30px 20px 20px 20px;
            line-height: 2;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <img src="cupid1.png" alt="cupid" class="header-cupid">
            <div>
                <h1>
                    <span class="star">♥</span>
                    MEOW
                    <span class="star">♥</span>
                </h1>
                <p class="tagline">~ for allen ~</p>
            </div>
            <img src="cupid1.png" alt="cupid" class="header-cupid">
        </div>
    </header>

    <div class="side-box">
        <div class="side-box-nav">
            <button>I</button>
            <button>LOVE</button>
            <button>YOU</button>
        </div>
        <div class="side-box-content">
            <p>happy valentine's day boob :3</p>
            <p>its been about half a year since we started dating <3...</p>
        </div>
    </div>

    <div class="side-box right-box" style="position:absolute;top:520px;left:300px;z-index:10;">
        <div class="side-box-nav">
            <button>SO</button>
            <button>SO</button>
            <button>MUCH</button>
        </div>
        <div class="side-box-content">
            <p>💕 Our story continues... 💕</p>
        </div>
    </div>

    <div class="heart-image">
        <a href="love.html">
            <img src="heart.png" alt="heart">
        </a>
    </div>

    <div class="side-box">
        <div class="side-box-nav">
            <button>Home</button>
            <button>About</button>
            <button>Contact</button>
        </div>
        <div class="side-box-content">
            <p>💖 You made it here! 💖</p>
        </div>
    </div>
</body>
</html>
